name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Security advisories for the app's libraries
        run: node tests/advisories.js
        continue-on-error: true
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
