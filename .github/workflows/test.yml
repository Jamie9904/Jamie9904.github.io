name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04 # pinned to a known version; on 11 Nov 2026 the test machines briefly could not reach Ubuntu's package servers
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Security advisories for the app's libraries
        run: node tests/advisories.js
        continue-on-error: true
      - name: Library files still match their fingerprints
        run: node tests/sri.js
        continue-on-error: true
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
