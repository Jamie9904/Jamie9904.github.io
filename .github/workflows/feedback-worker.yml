name: Deploy feedback Worker
# Puts tools/feedback-worker online on Cloudflare (free plan) and gives it the GitHub token as a secret.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
#   FEEDBACK_GITHUB_TOKEN  a fine-grained GitHub token for Jamie9904/lpn-feedback only: Issues and Contents read and write
# Runs by hand (Actions > Deploy feedback Worker > Run workflow) and when the Worker changes on main.
on:
  workflow_dispatch:
    inputs:
      test_report:
        description: "Also send a test report (makes one test issue in lpn-feedback)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["tools/feedback-worker/**", ".github/workflows/feedback-worker.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04 # pinned: on Ubuntu 26.04 (ubuntu-latest from Oct 2026) the test browser install fails
    timeout-minutes: 10
    steps:
      - name: Secrets are set
        id: ready
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          miss=""; [ -n "$A" ] || miss="$miss CLOUDFLARE_API_TOKEN"; [ -n "$B" ] || miss="$miss CLOUDFLARE_ACCOUNT_ID"; [ -n "$C" ] || miss="$miss FEEDBACK_GITHUB_TOKEN"
          if [ -z "$miss" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Before set-up, a push just skips; running it by hand says what's missing.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "::error title=Feedback Worker not set up::Missing repository secrets:$miss (see tools/feedback-worker/README.md)"; exit 1; fi
          echo "::notice title=Feedback Worker not set up::Skipped: missing repository secrets:$miss (see tools/feedback-worker/README.md)"
      - uses: actions/checkout@v5
        if: steps.ready.outputs.ok == '1'
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ok == '1'
        with:
          node-version: 22
      - name: Deploy
        if: steps.ready.outputs.ok == '1'
        id: deploy
        working-directory: tools/feedback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx --yes wrangler@3.114.0 deploy 2>&1) || {
            echo "$out"
            # Show Cloudflare's own reason in the notice, so it can be fixed without opening the log.
            why=$(echo "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -A3 'ERROR' | grep -v '^\s*$' | tr '\n' ' ' | cut -c1-500)
            echo "::error title=Feedback Worker deploy failed::$why"; exit 1; }
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          echo "::notice title=Feedback Worker address::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The GitHub token is only given to this one step, and only on stdin.
      - name: Give the Worker its GitHub token
        if: steps.ready.outputs.ok == '1'
        working-directory: tools/feedback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: printf '%s' "$FEEDBACK_GITHUB_TOKEN" | npx --yes wrangler@3.114.0 secret put GITHUB_TOKEN >/dev/null
      - name: The Worker answers
        if: steps.ready.outputs.ok == '1'
        run: |
          # A new workers.dev address can take a few minutes to start answering.
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: https://jamie9904.github.io" "${{ steps.deploy.outputs.url }}/report" || true)
            [ "$code" = 204 ] && break; sleep 5
          done
          echo "OPTIONS /report: $code"
          [ "$code" = 204 ] || { echo "::error title=Feedback Worker::didn't answer after 2 minutes (HTTP $code). A new address can take a little longer: run this again in a few minutes."; exit 1; }
          echo "::notice title=Feedback Worker::answers at ${{ steps.deploy.outputs.url }}/report"
      - name: Send a test report
        if: steps.ready.outputs.ok == '1' && inputs.test_report
        run: |
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Origin: https://jamie9904.github.io" -H "Content-Type: application/json" \
            -d '{"kind":"idea","text":"Test report from the deploy check. Safe to close.","app":"LPN Pallet Log"}' "${{ steps.deploy.outputs.url }}/report")
          echo "$out"
          code=$(echo "$out" | tail -1)
          [ "$code" = 200 ] && echo "::notice title=Feedback Worker test::A test issue was made in lpn-feedback: $(echo "$out" | head -1)" || { echo "::error title=Feedback Worker test::HTTP $code: $(echo "$out" | head -1). Check the GitHub token has Issues read and write on lpn-feedback."; exit 1; }
