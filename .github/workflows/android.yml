# Builds the offline Android app (APK) of the LPN Pallet Log from the same files as the website.
# The APK never needs the internet: the libraries are inside it, and Report a problem and Share this app are off.
# Every push to updates and main checks the offline copy with the internet blocked (no APK).
# The APK itself is only built and signed when the owner approves a new Android update: run this workflow by hand
# (Actions > Android app > Run workflow, or: gh workflow run android.yml --ref updates). With "Make and sign the APK"
# unticked (gh workflow run android.yml --ref updates -f apk=false) it only checks the Android code compiles: no APK. Download it from that run's
# "Artifacts" (LPN-Pallet-Log-Android).
# Signing needs the ANDROID_KEY_PASSWORD secret; see tools/android/sign.sh.
name: Android app
on:
  push:
    branches: [main, updates]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
    inputs:
      apk:
        description: "Make and sign the APK (untick to only check that the Android code compiles)"
        type: boolean
        default: true
      shots:
        description: "Screenshots on a virtual Android phone (about 10 minutes more)"
        type: boolean
        default: true
      qa:
        description: "Bug hunt on the virtual phone after the screenshots (about 15 minutes more; needs Screenshots ticked)"
        type: boolean
        default: false
permissions:
  contents: write # only to keep the signing key as a draft release (tools/android/sign.sh)
concurrency:
  group: android-app # one at a time, so the signing key is only ever made once
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Library files for the offline app
        run: node tools/android/fetch-libs.js
      - name: Build the offline copy of the app
        run: node tools/android/build-www.js
      - name: Check the offline copy with the internet blocked
        run: node tools/android/check-offline.js
      - name: Android project
        if: github.event_name == 'workflow_dispatch' # only when the owner approves an Android update
        working-directory: tools/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          # The version code (hidden; it must go up so each APK installs over the last) is the run number;
          # the name people see is the Android app's own build number from build.json.
          apk=$(node -p 'require("./build.json").build')
          node patch-android.js "${{ github.run_number }}" "Android APK build $apk"
          npx cap sync android
      - name: Build the APK
        if: github.event_name == 'workflow_dispatch' # only when the owner approves an Android update
        working-directory: tools/android/android
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease
          for f in app/build/outputs/apk/release/*.apk; do echo "::notice title=APK size::$(basename "$f"): $(du -m "$f" | cut -f1) MB"; done
      - name: Build a test copy for the screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.shots
        working-directory: tools/android/android
        # Only this test copy carries the manifest photos, for the phone text reader check in shots.sh.
        run: |
          mkdir -p app/src/main/assets/public/ocrtest
          cp ../../ocr-check/photos/* ../../ocr-check/expected.json app/src/main/assets/public/ocrtest/
          ./gradlew --no-daemon assembleQa
          rm -rf app/src/main/assets/public/ocrtest
      - name: Let the virtual phone use the processor
        if: github.event_name == 'workflow_dispatch' && inputs.shots
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on a virtual Android phone
        if: github.event_name == 'workflow_dispatch' && inputs.shots
        continue-on-error: true # the pictures help; a slow emulator mustn't stop an APK the owner asked for
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default # plain Android: Google Play services on the test image crashes soon after start-up and takes the app with it (ML Kit is built into the app)
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 3072M # about what a typical phone has free (the default is less, and the page was stopped part-way through the photos)
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: sh tools/android/shots.sh; if [ "${{ inputs.qa }}" = true ]; then sh tools/android/qa.sh; fi
      # The app's photo reading on the user's manifest photos, on the virtual phone (shots.sh): every LPN right and
      # nothing extra, or no APK. (A test that doesn't finish fails the run too.)
      - name: Photo reading on the virtual phone
        if: github.event_name == 'workflow_dispatch' && inputs.shots
        run: |
          f=shots/ocr-phone-reader.txt
          if [ ! -s "$f" ] || ! grep -q '"done"' "$f"; then echo "::error title=Photo reading on the phone::The photo test on the virtual phone did not finish (see ocr-log.txt with the screenshots)"; exit 1; fi
          l=$(grep '"liveDone"' "$f"); [ -n "$l" ] && echo "::notice title=Live read rule on the manifest photos::$l"
          d=$(grep '"done"' "$f"); echo "$d"
          if echo "$d" | grep -q '"right":\([0-9]*\),"want":\1,"missing":\[\],"extra":\[\]'; then echo "::notice title=Photo reading on the phone::$d"; else echo "::error title=Photo reading on the phone::$d"; exit 1; fi
      - name: Keep the screenshots on the draft release "Android screenshots" (replaced each run)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shots # also when the photo test failed, to see why
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ "$(ls shots | wc -l)" -gt 0 ] || { echo "no screenshots"; exit 0; }
          (cd shots && zip -q ../android-screenshots.zip *.png *.txt 2>/dev/null || zip -q ../android-screenshots.zip *.png)
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate -q '.[] | select(.draft and .name == "Android screenshots") | .id' | sort -n | head -n 1)
          if [ -z "$id" ]; then
            gh release create android-screenshots --repo "$GITHUB_REPOSITORY" --draft --title "Android screenshots" \
              --notes "Screenshots of the Android app on a virtual phone, from the latest Android app run started by hand. Replaced each run." android-screenshots.zip
          else
            for a in $(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" -q '.[].id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$a"; done
            gh api -X POST -H "Content-Type: application/zip" --input android-screenshots.zip "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=android-screenshots.zip" -q .name
          fi
      # The bug hunt (tools/android/qa.sh): its findings as notices, and its pictures and logs on the same draft release.
      - name: Bug hunt results
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shots && inputs.qa
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s qa/report.txt ] || { echo "::warning title=Bug hunt::No report from the virtual phone"; exit 0; }
          grep -E "app crashes|freezes|page errors|open after|memory:" qa/report.txt | while read -r l; do echo "::notice title=Bug hunt::$l"; done
          (cd qa && zip -q ../android-qa.zip *.png *.txt)
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate -q '.[] | select(.draft and .name == "Android screenshots") | .id' | sort -n | head -n 1)
          [ -n "$id" ] || exit 0
          for a in $(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" -q '.[] | select(.name == "android-qa.zip") | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$a"; done
          gh api -X POST -H "Content-Type: application/zip" --input android-qa.zip "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=android-qa.zip" -q .name
      - uses: actions/upload-artifact@v5
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shots
        with:
          name: android-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14
      - name: Sign the APK
        if: github.event_name == 'workflow_dispatch' && inputs.apk # only when the owner approves an Android update
        id: sign
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(node -p 'require("./tools/android/build.json").build')
          name="LPN-Pallet-Log-Android-APK-build-$apk.apk"
          set +e; sh tools/android/sign.sh tools/android/android/app/build/outputs/apk/release/app-release-unsigned.apk "$name"; rc=$?; set -e
          if [ $rc -eq 3 ]; then echo "signed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $rc -eq 0 ] || exit $rc
          echo "signed=yes" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.apk && steps.sign.outputs.signed == 'yes'
        with:
          name: LPN-Pallet-Log-Android
          path: ${{ steps.sign.outputs.name }}
          if-no-files-found: error
          retention-days: 90
