<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>Demo stage</title>
<style>
/* 1080×1920 vertical stage: headline at the top, the real app (390×844 at 1.66×) live in a phone frame,
   subtitles at the bottom, tap ripples, hook and end cards. Driven by record.mjs through window.__stage. */
@font-face{font-family:A;src:url(/t/AtkinsonHyperlegible-Regular.woff2)}
@font-face{font-family:A;font-weight:700;src:url(/t/AtkinsonHyperlegible-Bold.woff2)}
@font-face{font-family:M;font-weight:600;src:url(/t/IBMPlexMono-SemiBold.woff2)}
:root{--bg:#0c1830;--paper:#13264a;--ink:#eaf0fa;--mu:#9db0d0;--ac:#ff8a2a;--fp:#a9c95a;--fm:#6fa8ff;--bb:#dba56c}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif;color:var(--ink);background:radial-gradient(1200px 1000px at 50% 35%,#18345f,var(--bg) 70%)}
.head{position:absolute;left:60px;right:60px;top:84px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .35s,transform .35s}
.head.off{opacity:0;transform:translateY(-14px)}
.kick{font-size:34px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.hl{font-size:70px;font-weight:700;line-height:1.08;margin-top:14px}
.phone{position:absolute;left:50%;top:320px;width:675px;margin-left:-337px;border-radius:70px;background:#05090f;padding:14px;box-shadow:0 0 0 3px #2a3b5c,0 50px 120px rgba(0,0,0,.6);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
.phone.off{transform:translateY(240px);opacity:0}
.scr{width:647px;height:1396px;border-radius:56px;overflow:hidden;position:relative;background:#0c1830}
.scr iframe{width:390px;height:844px;border:0;transform:scale(1.66);transform-origin:0 0;position:absolute;left:0;top:0}
.sub{position:absolute;left:70px;right:70px;bottom:44px;min-height:100px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:40}
.sub span{display:inline-block;font-size:42px;line-height:1.25;font-weight:700;padding:16px 28px;border-radius:20px;background:rgba(5,9,15,.82);transition:opacity .25s}
.sub span:empty{opacity:0;padding:0}
.ripple{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:6px solid var(--ac);z-index:19;pointer-events:none;animation:rp .6s ease-out forwards}
@keyframes rp{from{transform:scale(.3);opacity:.95}to{transform:scale(1.5);opacity:0}}
.dotc{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.4);border:4px solid #fff;z-index:20;transition-property:transform,opacity;transition-timing-function:cubic-bezier(.4,0,.2,1);left:0;top:0;opacity:0}
.ring{position:absolute;border:6px solid var(--ac);border-radius:22px;z-index:18;pointer-events:none;opacity:0;transition:all .35s;box-shadow:0 0 40px rgba(255,138,42,.6)}
.ring.on{opacity:1}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:30;opacity:0;transition:opacity .45s;background:radial-gradient(1200px 1000px at 50% 40%,#18345f,var(--bg) 70%)}
.card.on{opacity:1}
.lpn{font-family:M;font-weight:600;font-size:116px;color:#fff;min-height:140px}
.logged{margin-top:56px;font-size:88px;font-weight:700;opacity:0;transform:scale(1.3);transition:all .35s cubic-bezier(.2,.8,.2,1)}
.logged.on{opacity:1;transform:none}
.tick{display:inline-block;width:100px;height:100px;border-radius:50%;background:var(--ac);color:#0c1830;line-height:100px;font-size:66px;margin-right:26px;vertical-align:middle}
.end h1{font-size:104px;margin:0}
.chips{margin-top:70px;display:flex;flex-direction:column;align-items:center;gap:22px}
.chip{display:inline-flex;align-items:center;gap:20px;font-size:48px;font-weight:700;padding:24px 40px;border-radius:999px;background:var(--paper);border:2px solid #2c4675;opacity:0;transform:translateX(-60px);transition:all .45s cubic-bezier(.2,.8,.2,1)}
.chip.on{opacity:1;transform:none}
.chip i{width:24px;height:24px;border-radius:50%}
.endt{margin-top:110px;font-size:96px;font-weight:700;opacity:0;transition:opacity .5s}
.endt.on{opacity:1}
.rule{width:110px;height:8px;border-radius:4px;background:var(--ac);margin:28px auto 0}
.sync{position:absolute;inset:0;background:#ff00ff;z-index:99;display:none}
</style></head><body>
<div class="sync" id="sync"></div>
<div class="head off" id="head"><div class="kick" id="kick"></div><div class="hl" id="hl"></div></div>
<div class="phone off" id="phone"><div class="scr"><iframe id="app" title="LPN Pallet Log"></iframe></div></div>
<div class="ring" id="ring"></div>
<div class="dotc" id="dot"></div>
<div class="card" id="hook"><div class="kick">Goods in</div><div class="lpn" id="lpnT" style="margin-top:40px"></div><div class="logged" id="logged"><span class="tick">✓</span><span style="vertical-align:middle">Logged.</span></div></div>
<div class="card end" id="end"><h1>Works offline.</h1><div class="chips"><div class="chip" id="c1"><i style="background:var(--fp)"></i>No account needed</div><div class="chip" id="c2"><i style="background:var(--fm)"></i>Saves as you go</div><div class="chip" id="c3"><i style="background:var(--bb)"></i>Excel and PDF built in</div></div><div class="endt" id="endt">LPN Pallet Log<div class="rule"></div></div></div>
<div class="sub"><span id="sub"></span></div>
<script>
const $=id=>document.getElementById(id);
window.__stage={
  load(state){for(const k of Object.keys(localStorage)) if(/^lpn/.test(k)) localStorage.removeItem(k);
    for(const [k,v] of Object.entries(state)) localStorage.setItem(k,v);
    return new Promise(r=>{$("app").onload=()=>r();$("app").src="/index.html?demo";})},
  sync(on){$("sync").style.display=on?"block":"none"},
  head(k,h){const e=$("head");if(!h){e.classList.add("off");return}e.classList.add("off");setTimeout(()=>{$("kick").textContent=k;$("hl").innerHTML=h;e.classList.remove("off")},200)},
  sub(t){$("sub").textContent=t||""},
  phone(on){$("phone").classList.toggle("off",!on)},
  card(id,on){$(id).classList.toggle("on",on)},
  typeLpn(s,ms){let i=0;const el=$("lpnT");el.textContent="";const iv=setInterval(()=>{el.textContent=s.slice(0,++i);if(i>=s.length)clearInterval(iv)},ms)},
  logged(on){$("logged").classList.toggle("on",on)},
  on(id,v){$(id).classList.toggle("on",v)},
  tap(x,y){const d=$("dot");d.style.transitionDuration="0ms";d.style.opacity=1;d.style.transform=`translate(${x}px,${y}px)`;const r=document.createElement("div");r.className="ripple";r.style.left=x+"px";r.style.top=y+"px";document.body.appendChild(r);setTimeout(()=>r.remove(),700);setTimeout(()=>{d.style.transitionDuration="300ms";d.style.opacity=0},450)},
  ring(b){const r=$("ring");if(!b){r.classList.remove("on");return}const p=12;Object.assign(r.style,{left:b.x-p+"px",top:b.y-p+"px",width:b.width+2*p+"px",height:b.height+2*p+"px"});r.classList.add("on")}
};
</script></body></html>
