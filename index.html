<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LPN Pallet Log</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6a727c;--bd:#d9dde3;--ac:#1f6feb;--dg:#c62828;--wn:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2126;--tx:#e8ebee;--mu:#98a1ab;--bd:#343a41;--ac:#4c8dff;--dg:#ef5350;--wn:#ffb74d}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2126;--tx:#e8ebee;--mu:#98a1ab;--bd:#343a41;--ac:#4c8dff;--dg:#ef5350;--wn:#ffb74d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:4px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;max-width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1;min-width:150px}
.grow input,.grow select{width:100%}
button{cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.d{color:var(--dg)}
.msg{min-height:1.2em;font-size:.85rem;color:var(--wn);margin-top:8px}
.sum{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--mu);margin-bottom:10px}
.sum b{color:var(--tx)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:.75rem;color:var(--mu);text-transform:uppercase}
td select{padding:6px}
td.l{font-family:ui-monospace,Menlo,Consolas,monospace}
textarea{font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
#fsdu{display:block;width:26px;height:26px;margin:9px 4px;accent-color:var(--ac)}
td input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
#logoImg{display:block;max-height:80px;max-width:100%;margin-bottom:10px}
#scanbox{margin-top:12px}
#video{width:100%;max-height:300px;background:#000;border-radius:8px;object-fit:cover}
[hidden]{display:none!important}
.empty{color:var(--mu);text-align:center;padding:18px}
.act{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="card">
  <img id="logoImg" alt="Company logo" hidden>
  <div class="row"><button id="logoBtn">Add logo</button><button class="d" id="logoRm" hidden>Remove logo</button></div>
  <input type="file" id="logoFile" accept="image/*" hidden>
</div>
<h1>LPN Pallet Log</h1>

<div class="card">
  <div class="row">
    <div><label for="date">Date</label><input type="date" id="date"></div>
    <div class="grow"><label for="recv">Received by</label><input id="recv" placeholder="Name of person who received the delivery"></div>
  </div>
</div>

<div class="card">
  <div class="row">
    <div class="grow"><label for="lpn">LPN number</label><input id="lpn" autocomplete="off" autocapitalize="characters" placeholder="Scan or type LPN, press Enter"></div>
    <div class="grow"><label for="type">Pallet type</label>
      <select id="type"><option>BB</option><option>FMCG</option><option>FPP</option><option>Mixed</option></select></div>
    <div><label for="fsdu">FSDU</label><input type="checkbox" id="fsdu" aria-label="Pallet contains an FSDU"></div>
    <button class="p" id="add">Add</button>
    <button id="scan">📷 Live scan</button>
    <button id="photo">Scan by photo</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </div>
  <div class="msg" style="color:var(--mu);margin-top:10px">Note: if Live scan doesn't work, try Scan by photo instead.</div>
  <div id="scanbox" hidden>
    <video id="video" playsinline muted></video>
    <div class="row" style="align-items:center;margin-top:8px">
      <span class="msg grow" id="smsg" style="margin:0;color:var(--tx)"></span>
      <button id="stopscan">Stop scanning</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div class="sum" id="sum"></div>
  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>LPN</th><th>Pallet type</th><th>FSDU</th><th></th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="act">
    <button class="d" id="clear">Clear all</button>
    <button class="p" id="dl">Download (Excel)</button>
  </div>
  <div class="msg" id="dlmsg"></div>
</div>
<div class="card" id="cmpCard">
  <h2 style="font-size:1.1rem;margin:0 0 10px">Check delivery against manifest</h2>
  <div class="row">
    <div class="grow"><label>1. LPN log</label><div class="row"><button id="cmpLogBtn">Upload log file</button><button id="cmpLogPhotoBtn">📷 Photo of printed log</button></div></div>
    <div class="grow"><label>2. Manifest photos</label><button id="cmpPhotoBtn">📷 Add manifest photo</button></div>
  </div>
  <div class="msg" id="cmpLogName" style="color:var(--mu)"></div>
  <label for="cmpLogNums" style="margin-top:10px">Numbers in the log (one per line: fix any mistakes)</label>
  <textarea id="cmpLogNums" rows="5"></textarea>
  <input type="file" id="cmpLogFile" accept=".xlsx,.xls,.csv" hidden>
  <input type="file" id="cmpLogPhotoFile" accept="image/*" multiple hidden>
  <input type="file" id="cmpPhotoFile" accept="image/*" multiple hidden>
  <div class="msg" id="cmpMsg"></div>
  <label for="cmpNums" style="margin-top:10px">Numbers read from the manifest (one per line: fix any mistakes or type them in)</label>
  <textarea id="cmpNums" rows="6"></textarea>
  <div class="sum" id="cmpSum" style="margin-top:10px"></div>
  <div class="act"><button class="d" id="cmpClear">Clear</button><button class="p" id="cmpGo">Compare and download</button></div>
</div>
</main>

<script>
const TYPES=["BB","FMCG","FPP","Mixed"];
let rows=[];
const $=id=>document.getElementById(id);

function load(){
  try{
    const d=localStorage.getItem("lpnlog");
    if(d){const o=JSON.parse(d);rows=o.rows||[];$("date").value=o.date||"";$("recv").value=o.recv||"";}
  }catch(e){}
  if(!$("date").value)$("date").value=new Date().toISOString().slice(0,10);
}
function save(){
  try{localStorage.setItem("lpnlog",JSON.stringify({rows,date:$("date").value,recv:$("recv").value}))}catch(e){}
}
function render(){
  const b=$("body");b.innerHTML="";
  if(!rows.length){b.innerHTML='<tr><td colspan="5" class="empty">No pallets logged yet</td></tr>'}
  rows.forEach((r,i)=>{
    const tr=document.createElement("tr");
    const n=document.createElement("td");n.textContent=i+1;
    const l=document.createElement("td");l.className="l";l.textContent=r.lpn;
    const t=document.createElement("td");
    const s=document.createElement("select");
    TYPES.forEach(x=>{const o=document.createElement("option");o.textContent=x;if(x===r.type)o.selected=true;s.appendChild(o)});
    s.onchange=()=>{r.type=s.value;save();summary()};
    t.appendChild(s);
    const f=document.createElement("td");
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!r.fsdu;cb.setAttribute("aria-label","FSDU for "+r.lpn);
    cb.onchange=()=>{r.fsdu=cb.checked;save()};
    f.appendChild(cb);
    const x=document.createElement("td");
    const btn=document.createElement("button");btn.className="d";btn.textContent="✕";btn.setAttribute("aria-label","Delete "+r.lpn);
    btn.onclick=()=>{rows.splice(i,1);save();render()};
    x.appendChild(btn);
    tr.append(n,l,t,f,x);b.appendChild(tr);
  });
  summary();
}
function summary(){
  const c={BB:0,FMCG:0,FPP:0,Mixed:0};rows.forEach(r=>c[r.type]++);
  $("sum").innerHTML="<span>Total: <b>"+rows.length+"</b></span><span>BB: <b>"+c.BB+"</b></span><span>FMCG: <b>"+c.FMCG+"</b></span><span>FPP: <b>"+c.FPP+"</b></span><span>Mixed: <b>"+c.Mixed+"</b></span><span>FSDU: <b>"+rows.filter(r=>r.fsdu).length+"</b></span>";
}
function add(){
  const v=$("lpn").value.trim();
  if(!v){$("msg").textContent="Enter an LPN number first.";return}
  addValue(v);
  $("lpn").value="";$("lpn").focus();
}
function addValue(v){
  $("msg").textContent=rows.some(r=>r.lpn.toLowerCase()===v.toLowerCase())?"Note: "+v+" was already logged (added again).":"";
  rows.push({lpn:v,type:$("type").value,fsdu:$("fsdu").checked});
  $("fsdu").checked=false;
  save();render();
}
/* ---- barcode scanning ---- */
let stream=null,timer=null,zxReader=null,lastCode="",lastAt=0,scanning=false;
function onCode(raw){
  const v=String(raw||"").trim();
  if(!v)return;
  const now=Date.now();
  if(v===lastCode&&now-lastAt<2500){lastAt=now;return}
  lastCode=v;lastAt=now;
  addValue(v);
  $("smsg").textContent="Added: "+v+" ("+$("type").value+")";
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
}
function loadZX(){
  return new Promise((res,rej)=>{
    if(window.ZXing)return res();
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload=res;s.onerror=()=>rej(new Error("scanner library failed to load"));
    document.head.appendChild(s);
  });
}
async function startScan(){
  if(scanning)return;
  const v=$("video");
  $("scanbox").hidden=false;$("smsg").textContent="Starting camera…";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $("smsg").textContent="Camera isn't available here. You can still type or use a handheld scanner in the LPN box.";return;
  }
  scanning=true;
  try{
    if("BarcodeDetector" in window){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
      v.srcObject=stream;await v.play();
      const det=new BarcodeDetector();
      timer=setInterval(async()=>{
        try{const r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}catch(e){}
      },250);
    }else{
      await loadZX();
      zxReader=new ZXing.BrowserMultiFormatReader();
      await zxReader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}},audio:false},v,(res)=>{if(res)onCode(res.getText())});
    }
    $("smsg").textContent="Point the camera at a pallet barcode.";
  }catch(e){
    stopScan(true);
    const denied=e&&(e.name==="NotAllowedError"||e.name==="SecurityError");
    $("scanbox").hidden=false;
    $("smsg").textContent=denied?"Camera access was blocked. Allow camera permission for this site in your browser settings, make sure the page is opened over https, or use “Scan by photo”.":"Couldn't start the scanner ("+((e&&e.message)||"error")+").";
  }
}
function stopScan(keepMsg){
  scanning=false;
  if(timer){clearInterval(timer);timer=null}
  if(zxReader){try{zxReader.reset()}catch(e){}zxReader=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const v=$("video");v.srcObject=null;
  if(!keepMsg){$("scanbox").hidden=true;$("smsg").textContent=""}
}
async function decodePhoto(file){
  const sm=$("smsg");$("scanbox").hidden=false;$("video").hidden=true;
  sm.textContent="Reading barcode…";
  try{
    let text="";
    if("BarcodeDetector" in window){
      const bmp=await createImageBitmap(file);
      const r=await new BarcodeDetector().detect(bmp);
      if(r.length)text=r[0].rawValue;
    }else{
      await loadZX();
      const url=URL.createObjectURL(file);
      try{const res=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);text=res.getText()}
      finally{URL.revokeObjectURL(url)}
    }
    if(text){lastCode="";onCode(text)}
    else sm.textContent="No barcode found. Move closer, hold steady and try again.";
  }catch(e){
    sm.textContent="No barcode found. Move closer, hold steady and try again.";
  }
}
$("scan").onclick=()=>{$("video").hidden=false;startScan()};
$("photo").onclick=()=>{$("file").value="";$("file").click()};
$("file").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)decodePhoto(f)};

$("stopscan").onclick=()=>stopScan();
$("add").onclick=add;
$("lpn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
$("date").onchange=save;
$("recv").oninput=save;
$("clear").onclick=()=>{
  if(rows.length&&confirm("Clear all "+rows.length+" entries?")){rows=[];save();render();$("msg").textContent=""}
};
function loadScript(src,test){
  return new Promise((res,rej)=>{
    if(test())return res();
    const el=document.createElement("script");
    const t=setTimeout(()=>rej(new Error("lib")),10000);
    el.src=src;
    el.onload=()=>{clearTimeout(t);test()?res():rej(new Error("lib"))};
    el.onerror=()=>{clearTimeout(t);rej(new Error("lib"))};
    document.head.appendChild(el);
  });
}
function saveBlob(data,type,name){
  const blob=new Blob([data],{type:type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;a.style.display="none";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},10000);
}
function fallbackXls(d){
  const esc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const who=($("recv").value||"").trim();
  const c={BB:0,FMCG:0,FPP:0,Mixed:0};rows.forEach(r=>c[r.type]++);
  const side=[["Pallet Type","Count","h"],["Brown Box",c.BB],["FMCG",c.FMCG],["FPP",c.FPP],["Mixed",c.Mixed],["Total",rows.length,"b"],["FSDU (not in total)",rows.filter(r=>r.fsdu).length],null,["Delivery Details","","h2"],["Date",d,"l"],["Received by",who,"l"]];
  const n=Math.max(rows.length,side.length-1);
  let h='<html><head><meta charset="utf-8"><style>td,th{font-family:Arial;font-size:14pt;border:2px solid #000;padding:4px;text-align:left}th{font-size:16pt;background:#e6e9ed}</style></head><body><table>';
  for(let i=-1;i<n;i++){
    const head=i<0,t=head?"th":"td";
    const l=head?["LPN","Pallet Type","FSDU"]:rows[i]?[rows[i].lpn,rows[i].type,rows[i].fsdu?"Yes":"No"]:null;
    const r=side[i+1]||null;
    h+="<tr>";
    h+=l?l.map((v,k)=>"<"+t+(k===0&&!head?' style="mso-number-format:\'\\@\'"':"")+">"+esc(v)+"</"+t+">").join(""):"<td></td><td></td><td></td>";
    h+='<td style="border:none"></td>';
    if(r){
      const tt=(r[2]==="h"||r[2]==="b")?"th":"td";
      if(r[2]==="h2")h+="<th colspan=2>"+esc(r[0])+"</th>";
      else if(r[2]==="l")h+="<th>"+esc(r[0])+"</th><td>"+esc(r[1])+"</td>";
      else h+="<"+tt+">"+esc(r[0])+"</"+tt+"><"+tt+">"+esc(r[1])+"</"+tt+">";
    }else h+="<td></td><td></td>";
    h+="</tr>";
  }
  h+="</table></body></html>";
  saveBlob(h,"application/vnd.ms-excel","LPN-log-"+d+".xls");
}
$("dl").onclick=async()=>{
  const m=$("dlmsg");m.textContent="";
  if(!rows.length){m.textContent="Add at least one LPN before downloading.";return}
  const d=$("date").value||"no-date";
  try{
    m.textContent="Preparing spreadsheet…";
    const hasX=()=>window.ExcelJS;
    let ok=true;
    try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js",hasX)}
    catch(e1){try{await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js",hasX)}catch(e2){ok=false}}
    if(!ok){
      fallbackXls(d);
      m.textContent="The full spreadsheet builder couldn't load (no internet or it's blocked), so a basic Excel file (.xls) was saved instead. Excel may warn about the format when opening: click Yes.";
      return;
    }
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet("LPN Log");
    ws.columns=[{width:30},{width:18},{width:11},{width:3},{width:26},{width:18}];
    const who=($("recv").value||"").trim();
    const c={BB:0,FMCG:0,FPP:0,Mixed:0};rows.forEach(r=>c[r.type]++);
    const side=[
      {v:["Pallet Type","Count"],h:1},
      {v:["Brown Box",c.BB]},{v:["FMCG",c.FMCG]},{v:["FPP",c.FPP]},{v:["Mixed",c.Mixed]},
      {v:["Total",rows.length],b:1},
      {v:["FSDU (not in total)",rows.filter(r=>r.fsdu).length]},
      null,
      {v:["Delivery Details",""],h:1,merge:1},
      {v:["Date",d],l:1},
      {v:["Received by",who],l:1}
    ];
    const n=Math.max(rows.length,side.length-1);
    let off=0;
    if(logo){
      off=5;
      try{
        const dim=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res([im.width,im.height]);im.onerror=rej;im.src=logo});
        const hPx=Math.max(50,Math.min(140,Math.round(428*dim[1]/dim[0])));
        const id=wb.addImage({base64:logo,extension:"png"});
        for(let k=1;k<=4;k++)ws.getRow(k).height=hPx*0.75/4;
        ws.addImage(id,{tl:{col:0,row:0},br:{col:3,row:4},editAs:"oneCell"});
      }catch(e){off=0}
    }
    const bc={argb:"FF000000"};
    const border={top:{style:"medium",color:bc},left:{style:"medium",color:bc},bottom:{style:"medium",color:bc},right:{style:"medium",color:bc}};
    for(let i=-1;i<n;i++){
      const r=ws.getRow(i+2+off);
      const head=i<0;
      const left=head?["LPN","Pallet Type","FSDU"]:rows[i]?[rows[i].lpn,rows[i].type,rows[i].fsdu?"Yes":"No"]:null;
      const right=side[i+1]||null;
      const put=(col,val,bold,isNum,big)=>{
        const cell=r.getCell(col);
        cell.value=val;
        cell.font={name:"Arial",size:big?16:14,bold:!!bold};
        cell.border=big?{...border,top:{style:"medium",color:bc}}:border;
        cell.alignment={vertical:"middle",horizontal:isNum?"center":"left",wrapText:true};
        if(bold)cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE6E9ED"}};
      };
      if(left)left.forEach((v,k)=>put(k+1,v,head,false,head));
      if(right){
        put(5,right.v[0],right.h||right.b||right.l,false,right.h);
        put(6,right.v[1],right.h||right.b,typeof right.v[1]==="number",right.h);
        if(right.merge)ws.mergeCells(r.number,5,r.number,6);
      }
      if(r.number>1&&(head||(right&&right.h))){
        const up=ws.getRow(r.number-1);
        (head?[1,2,3,5,6]:[5,6]).forEach(col=>{up.getCell(col).border={bottom:{style:"medium",color:bc}}});
      }
      r.height=(head||(right&&right.h))?26:22;
    }
    ws.pageSetup={orientation:"portrait",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:(1+off)+":"+(1+off),margins:{left:0.4,right:0.4,top:0.6,bottom:0.6,header:0.3,footer:0.3}};
    ws.views=[{state:"frozen",ySplit:1+off}];
    const buf=await wb.xlsx.writeBuffer();
    saveBlob(buf,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","LPN-log-"+d+".xlsx");
    m.textContent="";
  }catch(e){
    m.textContent="Couldn't create the spreadsheet: "+((e&&e.message)||"unknown error")+". Please try again or tell me this message.";
  }
};
/* ---- logo ---- */
/* Default logo: put an image file named logo.png in the same folder as this page. */
const DEFAULT_LOGO_URL="logo.png";
let logo="",custom="",defaultLogo="";
function scaleToData(bmp){
  const sc=Math.min(1,600/bmp.width);
  const cv=document.createElement("canvas");
  cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return cv.toDataURL("image/png");
}
function showLogo(){
  logo=custom||defaultLogo;
  $("logoImg").hidden=!logo;if(logo)$("logoImg").src=logo;
  $("logoBtn").textContent=logo?"Change logo":"Add logo";
  $("logoRm").hidden=!custom;
  $("logoRm").textContent=defaultLogo?"Reset to default logo":"Remove logo";
}
async function loadLogo(){
  try{custom=localStorage.getItem("lpnlogo")||""}catch(e){}
  showLogo();
  try{
    const r=await fetch(DEFAULT_LOGO_URL);
    if(r.ok)defaultLogo=scaleToData(await createImageBitmap(await r.blob()));
  }catch(e){}
  showLogo();
}
$("logoBtn").onclick=()=>{$("logoFile").value="";$("logoFile").click()};
$("logoFile").onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    custom=scaleToData(await createImageBitmap(f));
    try{localStorage.setItem("lpnlogo",custom)}catch(err){}
    showLogo();
  }catch(err){$("msg").textContent="Couldn't read that image file."}
};
$("logoRm").onclick=()=>{custom="";try{localStorage.removeItem("lpnlogo")}catch(e){}showLogo()};
loadLogo();
/* ---- manifest check ---- */
let logLpns=null;
const norm=v=>String(v).toUpperCase().replace(/[^A-Z0-9]/g,"");
const cmpMsg=t=>{$("cmpMsg").textContent=t};
async function loadExcel(){
  const t=()=>window.ExcelJS;
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js",t)}
  catch(e){await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js",t)}
}
function lpnsFromGrid(g){
  let col=-1,start=-1;
  g.forEach((row,i)=>{if(col>=0)return;row.forEach((c,k)=>{if(col<0&&String(c).trim().toUpperCase()==="LPN"){col=k;start=i}})});
  if(col<0)throw new Error("Couldn't find an LPN column in that file.");
  const out=[];
  for(let i=start+1;i<g.length;i++){const t=String(g[i][col]==null?"":g[i][col]).trim();if(!t)break;out.push(t)}
  return out;
}
async function readLog(f){
  const name=f.name.toLowerCase();
  if(name.endsWith(".xlsx")){
    await loadExcel();
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
    const g=[];
    wb.worksheets[0].eachRow({includeEmpty:true},row=>{
      g.push((row.values||[]).slice(1).map(v=>v==null?"":typeof v==="object"?(v.richText?v.richText.map(x=>x.text).join(""):(v.text||v.result||"")):v));
    });
    return lpnsFromGrid(g);
  }
  const text=await f.text();
  if(/<table/i.test(text)){
    const doc=new DOMParser().parseFromString(text,"text/html");
    return lpnsFromGrid([...doc.querySelectorAll("tr")].map(tr=>[...tr.children].map(c=>c.textContent.trim())));
  }
  return lpnsFromGrid(text.split(/\r?\n/).map(l=>l.split(",").map(x=>x.replace(/^"|"$/g,"").trim())));
}
async function shrink(f){
  const b=await createImageBitmap(f);
  const sc=Math.min(1,1800/Math.max(b.width,b.height));
  const cv=document.createElement("canvas");cv.width=Math.round(b.width*sc);cv.height=Math.round(b.height*sc);
  cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);
  return new Promise(res=>cv.toBlob(res,"image/jpeg",0.85));
}
const LPN_RE=/\b([A-Z]{1,3})[ \t]?([0-9ODILSBZ]{8,12})\b/gi;
function extractLpns(text){
  const out=[];let m;LPN_RE.lastIndex=0;
  while((m=LPN_RE.exec(text))){
    const part=m[2].toUpperCase();
    if((part.match(/[0-9]/g)||[]).length<6)continue;
    out.push(m[1].toUpperCase()+part.replace(/[OD]/g,"0").replace(/[IL]/g,"1").replace(/S/g,"5").replace(/B/g,"8").replace(/Z/g,"2"));
  }
  return out;
}
async function ocr(f){
  await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",()=>window.Tesseract);
  const w=await Tesseract.createWorker("eng");
  try{
    await w.setParameters({tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 "});
    return (await w.recognize(await shrink(f))).data.text;
  }finally{await w.terminate()}
}
async function readPhoto(f){return extractLpns(await ocr(f))}
function addNums(a,id){
  id=id||"cmpNums";
  const cur=$(id).value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const seen=new Set(cur.map(norm));
  a.forEach(x=>{x=String(x).trim();if(x&&!seen.has(norm(x))){seen.add(norm(x));cur.push(x)}});
  $(id).value=cur.join("\n");
}
$("cmpLogBtn").onclick=()=>{$("cmpLogFile").value="";$("cmpLogFile").click()};
$("cmpLogFile").onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  cmpMsg("Reading log…");
  try{const l=await readLog(f);$("cmpLogNums").value=l.join("\n");$("cmpLogName").textContent=f.name+": "+l.length+" LPNs found";cmpMsg("")}
  catch(err){$("cmpLogName").textContent="";cmpMsg(err.message||"Couldn't read that file.")}
};
$("cmpLogPhotoBtn").onclick=()=>{$("cmpLogPhotoFile").value="";$("cmpLogPhotoFile").click()};
$("cmpLogPhotoFile").onchange=async e=>{
  const files=[...(e.target.files||[])];if(!files.length)return;
  for(let i=0;i<files.length;i++){
    cmpMsg("Reading log photo "+(i+1)+" of "+files.length+"…");
    try{addNums(await readLogPhoto(files[i]),"cmpLogNums")}
    catch(err){cmpMsg("Couldn't read log photo "+(i+1)+": "+((err&&err.message)||"error")+" You can type the numbers in the box instead.");return}
  }
  $("cmpLogName").textContent="Read from photo of printed log";
  cmpMsg("Done. Check the log numbers are correct, then compare.");
};
$("cmpPhotoBtn").onclick=()=>{$("cmpPhotoFile").value="";$("cmpPhotoFile").click()};
$("cmpPhotoFile").onchange=async e=>{
  const files=[...(e.target.files||[])];if(!files.length)return;
  for(let i=0;i<files.length;i++){
    cmpMsg("Reading photo "+(i+1)+" of "+files.length+"…");
    try{addNums(await readPhoto(files[i]))}
    catch(err){cmpMsg("Couldn't read photo "+(i+1)+": "+((err&&err.message)||"error")+" You can type the numbers in the box instead.");return}
  }
  cmpMsg("Done. Check the numbers below are correct, then compare.");
};
$("cmpClear").onclick=()=>{$("cmpNums").value="";$("cmpLogNums").value="";$("cmpLogName").textContent="";$("cmpSum").innerHTML="";cmpMsg("")};
$("cmpGo").onclick=async()=>{
  const logList=$("cmpLogNums").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!logList.length){cmpMsg("Add the LPN log first: upload the exported file or take a photo of the printed copy.");return}
  const man=[...new Set($("cmpNums").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];
  if(!man.length){cmpMsg("Add manifest photos or type the manifest numbers first.");return}
  const have=new Set(logList.map(norm));
  const res=man.map(n=>({n,ok:have.has(norm(n))}));
  const miss=res.filter(r=>!r.ok).length;
  $("cmpSum").innerHTML="<span>On manifest: <b>"+res.length+"</b></span><span>✓ Found in log: <b>"+(res.length-miss)+"</b></span><span>✗ Missing from log: <b>"+miss+"</b></span>";
  cmpMsg("Preparing document…");
  try{
    await loadExcel();
    const d=$("date").value||"no-date";
    const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Manifest Check");
    ws.columns=[{width:40},{width:20}];
    const bc={argb:"FF000000"},bd={top:{style:"medium",color:bc},left:{style:"medium",color:bc},bottom:{style:"medium",color:bc},right:{style:"medium",color:bc}};
    const t=ws.getRow(1).getCell(1);t.value="Manifest check";t.font={name:"Arial",size:20,bold:true};
    ws.getRow(2).getCell(1).value="Date: "+d;
    ws.getRow(3).getCell(1).value="Found in log: "+(res.length-miss)+" of "+res.length+"   |   Missing from log: "+miss;
    [2,3].forEach(r=>ws.getRow(r).getCell(1).font={name:"Arial",size:14});
    const hr=ws.getRow(5);
    ["LPN on manifest","In log?"].forEach((h,k)=>{const c=hr.getCell(k+1);c.value=h;c.font={name:"Arial",size:16,bold:true};c.border=bd;c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE6E9ED"}}});
    hr.height=26;
    res.forEach((x,i)=>{
      const r=ws.getRow(6+i);r.height=24;
      const a=r.getCell(1),b=r.getCell(2);
      a.value=x.n;a.font={name:"Arial",size:14};a.border=bd;a.alignment={vertical:"middle"};
      b.value=x.ok?"✓ Found":"✗ Missing";
      b.font={name:"Arial",size:14,bold:true,color:{argb:x.ok?"FF1B7A2F":"FFC62828"}};
      b.border=bd;b.alignment={vertical:"middle"};
      b.fill={type:"pattern",pattern:"solid",fgColor:{argb:x.ok?"FFDDF3E1":"FFFADBDB"}};
    });
    ws.pageSetup={orientation:"portrait",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:"5:5",margins:{left:0.5,right:0.5,top:0.6,bottom:0.6,header:0.3,footer:0.3}};
    await sendFile(await wb.xlsx.writeBuffer(),"Manifest-check-"+d+".xlsx","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    cmpMsg("");
  }catch(err){
    if(err&&err.code==="declined"){cmpMsg("");return}
    cmpMsg("Couldn't create the document: "+((err&&err.message)||"error"));
  }
};
load();render();
